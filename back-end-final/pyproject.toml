[project]
name = "back-end-final"
version = "0.1.0"
description = "FastAPI backend for AI-powered project generation"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",

    "sqlalchemy[asyncio]>=2.0.30",
    "sqlmodel>=0.0.22",
    "aiomysql>=0.2.0",
    "alembic>=1.13",

    "pyjwt[crypto]>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",

    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "slowapi>=0.1.9",
    "structlog>=24.1",

    "openai>=1.0",
    "anthropic>=0.18",
    "google-genai>=1.0",
    "google-generativeai>=0.3",
    "ollama>=0.1",

    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["live_pipeline_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "E501",
    "B008",     # FastAPI uses Depends/File/Form/Query call defaults intentionally.
    "ASYNC240", # This service does local filesystem work inside async orchestration.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "app.api.deps",
    "app.api.v1.chatbot",
    "app.api.v1.ws",
    "app.db.mixins",
    "app.llm.*",
    "app.models.chat",
    "app.models.pipeline_memory",
    "app.models.template",
    "app.realtime.manager",
    "app.schemas.chat",
    "app.services.chat",
    "app.services.generator",
    "app.services.model_pipeline.*",
    "app.services.model_project_pipeline",
    "app.services.project_context",
    "app.services.project_edit.artifact_validation",
    "app.services.project_files",
]
ignore_errors = true
